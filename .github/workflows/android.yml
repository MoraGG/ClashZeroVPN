name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - Show files
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== Files in directory ==="
        ls -la
        echo ""
        echo "=== gradlew permissions ==="
        ls -la gradlew
    
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Debug - Show Android SDK
      run: |
        echo "=== Android SDK ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME 2>/dev/null || echo "SDK not found"
    
    - name: Accept Android SDK licenses
      run: |
        echo "=== Accepting licenses ==="
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi
        if [ -d "$ANDROID_HOME/tools/bin" ]; then
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        fi
        echo "=== License check complete ==="
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Make gradlew executable
      run: |
        echo "=== Making gradlew executable ==="
        chmod +x gradlew
        ls -la gradlew
    
    - name: Build Debug APK
      run: |
        echo "=== Building APK ==="
        ./gradlew assembleDebug --no-daemon --stacktrace
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_SDK_ROOT: /opt/android-sdk
        JAVA_OPTS: -Xmx2048m
    
    - name: Show build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "No APK directory"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK"
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Release APK
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/release/*.apk
        asset_name: ClashZeroVPN-${{ github.ref_name }}.apk
        asset_content_type: application/vnd.android.package-archive
